[project]
name = "agentic-rag-goodmem"
version = "0.1.0"
description = "LangGraph agentic RAG notebooks backed by GoodMem"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.13,<5",
    "goodmem==0.1.34",
    "httpx>=0.28,<1",
    "langchain>=1.0,<2",
    "langchain-cohere>=0.5,<1",
    "langchain-groq>=1.0,<2",
    "langgraph>=1.0,<2",
    "python-dotenv>=1.0,<2",
]

[project.scripts]
goodmem-rag = "goodmem_rag.cli:main"

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.12", "nbclient>=0.10", "nbformat>=5.10", "ipykernel>=6.29"]
notebooks = ["jupyterlab>=4.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["goodmem_rag"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
